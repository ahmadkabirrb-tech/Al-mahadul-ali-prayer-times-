<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7f5">
<title>আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন | নামাযের সময়</title>

<!-- Google Fonts: Hind Siliguri -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4f7f5; 
  --green: #13785b; 
  --text-dark: #111;
  --card-bg: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text-dark);
  /* এখানে Hind Siliguri ফন্ট সেট করা হলো */
  font-family: 'Hind Siliguri', sans-serif; 
  -webkit-font-smoothing: antialiased;
}

/* হেডার ডিজাইন */
header {
  background: #eaf1ec;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #dce5df;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--green);
  font-size: 22px;
  font-weight: 700;
}
.logo-icon {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: 2px solid var(--green);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}

/* মূল কন্টেন্ট এরিয়া */
.wrap {
  width: min(600px, 100% - 30px);
  margin: 20px auto;
}

.top-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.top-title h2 {
  font-size: 22px;
  margin: 0;
  color: #111;
  font-weight: 600;
}
.lang-btn {
  background: #fff;
  border: 1px solid #ccc;
  padding: 6px 12px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--green);
  cursor: pointer;
}

/* নামাজের কার্ড লিস্ট */
.prayer-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.prayer-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.prayer-info {
  display: flex;
  align-items: center;
  gap: 15px;
}
.icon-box {
  width: 50px;
  height: 50px;
  background: #f8faf9;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}
.prayer-name {
  font-size: 22px; /* ফন্ট সাইজ বড় করা হয়েছে */
  font-weight: 600;
  color: #222;
}
.prayer-time {
  font-size: 24px; /* সময়ের ফন্ট সাইজ বড় করা হয়েছে */
  font-weight: 700;
  color: #111;
  letter-spacing: 0.5px;
}

/* নোটিশ সেকশন */
.notice-section {
  margin-top: 30px;
}
.notice-section h3 {
  font-size: 20px;
  color: #222;
  margin-bottom: 10px;
  font-weight: 600;
}
.notice-box {
  background: #eaf1ec;
  padding: 15px;
  border-radius: 10px;
  border-left: 4px solid var(--green);
  font-size: 16px;
  color: #333;
}

/* ফুটার */
footer {
  text-align: center;
  padding: 30px 10px;
  color: #666;
  font-size: 15px;
}
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-icon">🕌</div>
    <span>আল মাহাদুল আলী</span>
  </div>
</header>

<main class="wrap">
  <div class="top-title">
    <h2 id="pageTitle">জামাতের সময়সূচি</h2>
    <button class="lang-btn" id="langBtn" type="button">English</button>
  </div>

  <div class="prayer-list" id="prayerGrid">
    <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে কার্ড তৈরি হবে -->
  </div>

  <div class="notice-section">
    <h3 id="noticeHeading">নোটিশ বোর্ড</h3>
    <div class="notice-box">
      <div id="noticeText">মসজিদের যেকোনো গুরুত্বপূর্ণ ঘোষণা এখানে প্রকাশ করা হবে।</div>
    </div>
  </div>
</main>

<footer id="footerText">
  আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন
</footer>

<script>
// আপনার নামাজের সময়
const mosqueData = {
  prayers: [
    { bn: "ফজর", en: "Fajr", jamaat: "৫:১৫ AM", icon: "🌅" },
    { bn: "যোহর", en: "Dhuhr", jamaat: "১:৪৫ PM", icon: "☀️" },
    { bn: "আসর", en: "Asr", jamaat: "৪:৩০ PM", icon: "🌤️" },
    { bn: "মাগরিব", en: "Maghrib", jamaat: "৫:৪৫ PM", icon: "🌇" },
    { bn: "এশা", en: "Isha", jamaat: "৯:১৫ PM", icon: "🌙" }
  ],
  notice_bn: "মসজিদের যেকোনো গুরুত্বপূর্ণ ঘোষণা এখানে প্রকাশ করা হবে।",
  notice_en: "Any important mosque announcements will be published here."
};

let lang = "bn";
const $ = id => document.getElementById(id);

function render() {
  document.documentElement.lang = lang;
  
  $("pageTitle").textContent = lang === "bn" ? "জামাতের সময়সূচি" : "Jamaat Timetable";
  $("langBtn").textContent = lang === "bn" ? "English" : "বাংলা";
  $("noticeHeading").textContent = lang === "bn" ? "নোটিশ বোর্ড" : "Notice Board";
  $("noticeText").textContent = lang === "bn" ? mosqueData.notice_bn : mosqueData.notice_en;
  $("footerText").textContent = lang === "bn" ? "আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন" : "Al Mahadul Ali Lil Fiqh Fid-Din";

  $("prayerGrid").innerHTML = mosqueData.prayers.map(p => `
    <div class="prayer-card">
      <div class="prayer-info">
        <div class="icon-box">${p.icon}</div>
        <div class="prayer-name">${lang === "bn" ? p.bn : p.en}</div>
      </div>
      <div class="prayer-time">${p.jamaat}</div>
    </div>
  `).join("");
}

$("langBtn").addEventListener("click", () => {
  lang = lang === "bn" ? "en" : "bn";
  render();
});

render();
</script>

</body>
</html>
