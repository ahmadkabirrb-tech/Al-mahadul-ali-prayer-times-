<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5a45">
<title>আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন | নামাযের সময়</title>

<!-- ফন্ট: হিন্দ শিলিগুড়ি -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --green-dark: #0a5c21; 
  --bg-color: #ffffff;
  --card-bg: #ffffff;
  --text-dark: #222222;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-dark);
  font-family: 'Hind Siliguri', sans-serif;
}

/* --- হেডার সেকশন (আগের চেয়ে ছোট করা হয়েছে) --- */
header {
  background: linear-gradient(to bottom, #0b5e22, #084a1a);
  padding: 15px 10px 12px; /* প্যাডিং কমিয়ে ছোট করা হয়েছে */
  text-align: center;
  border-bottom: 4px solid #8bc34a; 
}

.arabic-logo {
  color: #fff;
  font-size: 28px; /* আরবি ফন্ট ছোট করা হয়েছে */
  margin-bottom: 5px;
  font-family: 'Traditional Arabic', 'Scheherazade', serif; 
  line-height: 1.2;
}

.bangla-title {
  color: #fff;
  font-size: 20px; /* বাংলা টাইটেল ফন্ট ছোট করা হয়েছে */
  font-weight: 600;
  margin: 0;
}

/* আজকের তারিখের স্টাইল */
.date-text {
  color: #e0f2e9; /* হালকা সবুজাভ সাদা রঙ */
  font-size: 15px;
  margin-top: 5px;
  font-weight: 500;
}

/* --- মূল কন্টেন্ট --- */
main {
  width: min(600px, 100% - 30px);
  margin: 0 auto;
  padding-bottom: 50px;
}

/* সবুজ গোলাকার বাটন */
.title-badge {
  background-color: #0a5c21;
  color: #fff;
  text-align: center;
  font-size: 20px; /* বাটনের ফন্ট সাইজ একটু কমানো হয়েছে */
  font-weight: 600;
  padding: 8px 30px;
  border-radius: 50px;
  width: fit-content;
  margin: 20px auto 25px;
}

/* --- কার্ড লিস্ট --- */
.prayer-container {
  background-color: #f7fcf8; 
  padding: 15px;
  border-radius: 10px;
}

.prayer-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.prayer-card {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  border: 1px solid #eaeaea;
}

.prayer-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-box {
  width: 45px;
  height: 45px;
  background: #f0f4f1;
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}

.prayer-name {
  font-size: 20px;
  font-weight: 600;
  color: #111;
}

.prayer-time {
  font-size: 22px;
  font-weight: 700;
  color: #111;
}

footer {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 13px;
}
</style>
</head>
<body>

<header>
  <div class="arabic-logo">المعهد العالي للفقه في الدين</div>
  <h1 class="bangla-title">আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন</h1>
  <div class="date-text" id="todayDate">তারিখ লোড হচ্ছে...</div>
</header>

<main>
  <div class="title-badge">নামাযের সময়সূচি</div>

  <div class="prayer-container">
    <div class="prayer-list" id="prayerGrid">
      <!-- জাভাস্ক্রিপ্ট দিয়ে কার্ড তৈরি হবে -->
    </div>
  </div>
</main>

<footer>
  আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন
</footer>

<script>
// ১. আজকের তারিখ ও বার অটোমেটিক দেখানোর কোড
const todayDateElement = document.getElementById("todayDate");
const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
// বাংলা ফরম্যাটে তারিখ সেট করা
todayDateElement.textContent = today.toLocaleDateString('bn-BD', options);

// ২. আপনার দেওয়া জামাতের সময়গুলো
const mosqueData = [
  { name: "الفجر", time: "৫:১৫ AM", icon: "🌅" },
  { name: "الظهر", time: "১:৪৫ PM", icon: "☀️" },
  { name: "العصر", time: "৪:৩০ PM", icon: "🌤️" },
  { name: "المغرب", time: "৫:৪৫ PM", icon: "🌇" },
  { name: "العشاء", time: "৯:১৫ PM", icon: "🌙" }
];

// কার্ডগুলো ওয়েবসাইটে দেখানোর কোড
const grid = document.getElementById("prayerGrid");

grid.innerHTML = mosqueData.map(p => `
  <div class="prayer-card">
    <div class="prayer-info">
      <div class="icon-box">${p.icon}</div>
      <div class="prayer-name">${p.name}</div>
    </div>
    <div class="prayer-time">${p.time}</div>
  </div>
`).join("");

</script>

</body>
</html>
