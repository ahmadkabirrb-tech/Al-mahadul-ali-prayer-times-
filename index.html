<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1321">
<title>আল মাহাদুল আলী | ওয়েবসাইট</title>

<!-- ফন্টস -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --text-main: #111827;
  --text-muted: #4b5563;
  --primary-green: #0f4c3a;
  --bg-green: #f0fdf4; /* হালকা সবুজ ব্যাকগ্রাউন্ড */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Hind Siliguri', sans-serif;
  background-color: var(--bg-green);
  
  /* হালকা ইসলামিক প্যাটার্ন (খুব কম অপাসিটি) */
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%230f4c3a' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* --- হেডার (নতুন কালার ও গ্রেডিয়েন্ট) --- */
header {
  background: linear-gradient(135deg, #090a0f 0%, #151b2b 100%); /* গাঢ় নেভি গ্রেডিয়েন্ট */
  text-align: center;
  padding: 25px 15px 20px;
  border-bottom: 3px solid #0f4c3a;
}

.arabic-logo {
  color: #ffffff;
  font-size: 28px;
  font-family: 'Amiri', serif;
  margin-bottom: 5px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.bangla-title {
  color: #e2e8f0;
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

/* নতুন তারিখের ডিজাইন */
.date-text {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 8px;
  font-weight: 400;
  letter-spacing: 0.5px;
}

/* --- নেভিগেশন ট্যাব (Tabs) --- */
.nav-tabs {
  display: flex;
  justify-content: center;
  background: #ffffff;
  padding: 10px 15px;
  gap: 8px;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 10;
}

.tab-btn {
  background: #f3f4f6;
  color: #4b5563;
  border: none;
  padding: 8px 16px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tab-btn.active {
  background: var(--primary-green);
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(15, 76, 58, 0.2);
}

/* --- মূল কন্টেন্ট --- */
main {
  flex: 1;
  width: min(600px, 100% - 24px);
  margin: 20px auto;
}

.tab-content {
  display: none; 
  animation: fadeIn 0.4s ease;
}

.tab-content.active {
  display: block; 
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  text-align: center;
  color: var(--primary-green);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
}

/* --- ১. নামাজের সময়সূচি ডিজাইন --- */
.prayer-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.prayer-card {
  background: #ffffff;
  border-radius: 14px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  border: 1px solid #f3f4f6;
}

.prayer-name-ar {
  font-family: 'Amiri', serif;
  font-size: 22px;
  font-weight: 700;
  color: #111827;
}

.prayer-time {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary-green);
}

/* --- ২. জরুরী এলান ডিজাইন --- */
.notice-board {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.notice-card {
  background: #ffffff;
  padding: 18px;
  border-radius: 12px;
  border-left: 4px solid #ef4444;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.notice-date {
  color: #ef4444;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 5px;
  display: block;
}

.notice-text {
  font-size: 16px;
  color: #374151;
  line-height: 1.5;
}

/* --- ৩. আমাদের পরিচয় ডিজাইন --- */
.about-card {
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.about-image {
  width: 100%;
  height: 200px;
  background-color: #e5e7eb;
  background-image: url('https://images.unsplash.com/photo-1542816417-0983c9c9ad53?q=80&w=800&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
}

.about-text {
  padding: 20px;
  font-size: 15px;
  color: #374151;
  line-height: 1.7;
}

footer {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 20px;
}
</style>
</head>
<body>

<header>
  <div class="arabic-logo">المعهد العالي للفقه في الدين</div>
  <h1 class="bangla-title">আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন</h1>
  <!-- অটোমেটিক তারিখ -->
  <div class="date-text" id="todayDate"></div>
</header>

<!-- নেভিগেশন ট্যাব (বাটন) -->
<div class="nav-tabs">
  <button class="tab-btn active" onclick="openTab('times', this)">সময়সূচি</button>
  <button class="tab-btn" onclick="openTab('notice', this)">জরুরী এলান</button>
  <button class="tab-btn" onclick="openTab('about', this)">আমাদের পরিচয়</button>
</div>

<main>
  <!-- ১. নামাজের সময়সূচি -->
  <div id="times" class="tab-content active">
    <h2 class="section-title">জামাতের সময়সূচি</h2>
    <div class="prayer-list" id="prayerGrid">
      <!-- জাভাস্ক্রিপ্ট দিয়ে কার্ড তৈরি হবে -->
    </div>
  </div>

  <!-- ২. জরুরী এলান -->
  <div id="notice" class="tab-content">
    <h2 class="section-title">জরুরী এলান</h2>
    <div class="notice-board">
      
      <!-- এলান ১ -->
      <div class="notice-card">
        <span class="notice-date">১৮ অক্টোবর, ২০২৬</span>
        <div class="notice-text">।</div>
      </div>

      <!-- এলান ২ -->
      <div class="notice-card">
        <span class="notice-date">১৫ অক্টোবর, ২০২৬</span>
        <div class="notice-text"></div>
      </div>

    </div>
  </div>

  <!-- ৩. আমাদের পরিচয় -->
  <div id="about" class="tab-content">
    <h2 class="section-title">আমাদের পরিচয়</h2>
    <div class="about-card">
      <div class="about-image"></div>
      <div class="about-text">
        <p><strong>আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন</strong> </p>
        <p><strong>যোগাযোগ:</strong> ০১৭xxxxxxxx <br>
        <strong>ঠিকানা:</strong> আপনার মসজিদের ঠিকানা এখানে লিখুন।</p>
      </div>
    </div>
  </div>
</main>

<footer>
  আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন
</footer>

<script>
// ১. আজকের তারিখ ও বার
const todayDateElement = document.getElementById("todayDate");
const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
todayDateElement.textContent = today.toLocaleDateString('bn-BD', options);

// ২. নামাজের তথ্য
const mosqueData = [
  { ar: "الفجر", time: "৫:১৫ AM" },
  { ar: "الظهر", time: "১:৪৫ PM" },
  { ar: "العصر", time: "৪:৩০ PM" },
  { ar: "المغرب", time: "৫:৪৫ PM" },
  { ar: "العشاء", time: "৯:১৫ PM" }
];

// কার্ড তৈরি
const grid = document.getElementById("prayerGrid");
grid.innerHTML = mosqueData.map(p => `
  <div class="prayer-card">
    <div class="prayer-name-ar">${p.ar}</div>
    <div class="prayer-time">${p.time}</div>
  </div>
`).join("");

// ৩. ট্যাব পরিবর্তন করার ফাংশন
function openTab(tabName, btn) {
  // সব কন্টেন্ট লুকানো
  let contents = document.getElementsByClassName("tab-content");
  for (let i = 0; i < contents.length; i++) {
    contents[i].classList.remove("active");
  }
  
  // সব বাটনের অ্যাক্টিভ ক্লাস রিমুভ করা
  let buttons = document.getElementsByClassName("tab-btn");
  for (let i = 0; i < buttons.length; i++) {
    buttons[i].classList.remove("active");
  }
  
  // ক্লিক করা ট্যাব ও বাটন শো করা
  document.getElementById(tabName).classList.add("active");
  btn.classList.add("active");
}
</script>

</body>
</html>
