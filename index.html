<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>আল মাহাদুল আলী | নামাযের সময়সূচি</title>

<!-- ফন্টস: হিন্দ শিলিগুড়ি (বাংলা) এবং Amiri (আরবি) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --text-main: #111827;
  --green-primary: #0f4c3a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Hind Siliguri', sans-serif;
  
  /* এখানে আপনার পছন্দের মসজিদের ছবিটি দেওয়া হলো */
  background-image: url('https://images.unsplash.com/photo-1542816417-0983c9c9ad53?q=80&w=1000&auto=format&fit=crop'); 
  
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 30px;
  position: relative;
}

/* ছবির ওপর একটি হালকা কালো শেড (যাতে সাদা লেখা ফুটে ওঠে) */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.4); 
  z-index: -1;
}

/* --- হেডার সেকশন --- */
.header-section {
  text-align: center;
  margin-bottom: 20px;
  z-index: 1;
}

.arabic-logo {
  color: #ffffff;
  font-size: 28px; 
  font-family: 'Amiri', serif;
  line-height: 1.2;
  margin-bottom: 4px;
  text-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

.bangla-title {
  color: #b4e197;
  font-size: 15px; 
  font-weight: 600;
  margin: 0;
  letter-spacing: 0.5px;
}

/* তারিখের স্টাইল */
.date-text {
  color: #e5e7eb;
  font-size: 14px;
  margin-top: 6px;
  font-weight: 400;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

/* --- গ্লাস কার্ড (Glassmorphism) --- */
.glass-container {
  width: min(90%, 450px);
  background: rgba(255, 255, 255, 0.9); 
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border-radius: 35px;
  padding: 25px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  border: 1px solid rgba(255, 255, 255, 0.5);
  position: relative;
  z-index: 1;
}

.section-title {
  text-align: center;
  color: #111827;
  font-size: 20px;
  font-weight: 700;
  margin-top: 0;
  margin-bottom: 20px;
}

/* --- নামাজের লিস্ট --- */
.prayer-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.prayer-card {
  background: #ffffff;
  border-radius: 14px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid #f3f4f6;
}

/* শুধু আরবি নাম */
.prayer-name-ar {
  font-family: 'Amiri', serif;
  font-size: 20px; 
  font-weight: 700;
  color: #111827;
}

.prayer-time {
  font-size: 20px;
  font-weight: 700;
  color: #000000;
}

footer {
  margin-top: 25px;
  margin-bottom: 20px;
  color: #ffffff;
  font-size: 13px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  z-index: 1;
}
</style>
</head>
<body>

<!-- হেডার -->
<div class="header-section">
  <div class="arabic-logo">المعهد العالي للفقه في الدين</div>
  <h1 class="bangla-title">আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন</h1>
  <!-- অটোমেটিক তারিখ -->
  <div class="date-text" id="todayDate"></div>
</div>

<!-- গ্লাস ইফেক্টের মূল বক্স -->
<div class="glass-container">
  <h2 class="section-title">নামাযের সময়সূচি</h2>

  <div class="prayer-list" id="prayerGrid">
    <!-- জাভাস্ক্রিপ্ট দিয়ে কার্ড তৈরি হবে -->
  </div>
</div>

<footer>
  আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন
</footer>

<script>
// ১. আজকের তারিখ ও বার
const todayDateElement = document.getElementById("todayDate");
const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
todayDateElement.textContent = today.toLocaleDateString('bn-BD', options);

// ২. নামাজের তথ্য (শুধু আরবি নাম)
const mosqueData = [
  { ar: "الفجر", time: "৫:১৫ AM" },
  { ar: "الظهر", time: "১:৪৫ PM" },
  { ar: "العصر", time: "৪:৩০ PM" },
  { ar: "المغرب", time: "৫:৪৫ PM" },
  { ar: "العشاء", time: "৯:১৫ PM" }
];

// কার্ড তৈরি
const grid = document.getElementById("prayerGrid");

grid.innerHTML = mosqueData.map(p => `
  <div class="prayer-card">
    <div class="prayer-name-ar">${p.ar}</div>
    <div class="prayer-time">${p.time}</div>
  </div>
`).join("");

</script>

</body>
</html>
