<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5a45">
<title>আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন | নামাযের সময়</title>

<!-- ফন্ট: হিন্দ শিলিগুড়ি -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --green-dark: #0a5c21; /* হেডারের গাঢ় সবুজ */
  --green-light: #0d7028;
  --bg-color: #ffffff;
  --card-bg: #ffffff;
  --text-dark: #222222;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-dark);
  font-family: 'Hind Siliguri', sans-serif;
}

/* --- হেডার সেকশন --- */
header {
  background: linear-gradient(to bottom, #0b5e22, #084a1a);
  padding: 30px 20px 25px;
  text-align: center;
  border-bottom: 5px solid #8bc34a; /* হালকা সবুজ বর্ডার */
}

.arabic-logo {
  color: #fff;
  font-size: 38px;
  margin-bottom: 10px;
  /* আরবি লেখার জন্য একটি সুন্দর ফন্ট */
  font-family: 'Traditional Arabic', 'Scheherazade', serif; 
  line-height: 1.2;
}

.bangla-title {
  color: #fff;
  font-size: 26px;
  font-weight: 600;
  margin: 0;
}

/* --- মূল কন্টেন্ট --- */
main {
  width: min(600px, 100% - 30px);
  margin: 0 auto;
  padding-bottom: 50px;
}

/* সবুজ গোলাকার বাটন */
.title-badge {
  background-color: #0a5c21;
  color: #fff;
  text-align: center;
  font-size: 24px;
  font-weight: 600;
  padding: 10px 35px;
  border-radius: 50px;
  width: fit-content;
  margin: 30px auto 35px;
}

/* --- কার্ড লিস্ট --- */
.prayer-container {
  background-color: #f7fcf8; /* হালকা সবুজাভ ব্যাকগ্রাউন্ড */
  padding: 15px;
  border-radius: 10px;
}

.prayer-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.prayer-card {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  border: 1px solid #eaeaea;
}

.prayer-info {
  display: flex;
  align-items: center;
  gap: 15px;
}

.icon-box {
  width: 50px;
  height: 50px;
  background: #f0f4f1;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
}

.prayer-name {
  font-size: 22px;
  font-weight: 600;
  color: #111;
}

.prayer-time {
  font-size: 24px;
  font-weight: 700;
  color: #111;
  letter-spacing: 0.5px;
}

/* ফুটার */
footer {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 14px;
}
</style>
</head>
<body>

<header>
  <!-- আরবি লোগো (এখানে আপনার মসজিদের আসল আরবি নামের ছবি দিতে পারেন, আপাতত টেক্সট দেওয়া হলো) -->
  <div class="arabic-logo">المعهد العالي للفقه في الدين</div>
  <h1 class="bangla-title">আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন</h1>
</header>

<main>
  <div class="title-badge">নামাযের সময়সূচি</div>

  <div class="prayer-container">
    <div class="prayer-list" id="prayerGrid">
      <!-- জাভাস্ক্রিপ্ট দিয়ে কার্ড তৈরি হবে -->
    </div>
  </div>
</main>

<footer>
  আল মাহাদুল আলী লিল ফিকহ ফিদ্দীন
</footer>

<script>
// আপনার দেওয়া জামাতের সময়গুলো এখানে বসানো হলো
const mosqueData = [
  { name: "الفجر", time: "৫:১৫ AM", icon: "🌅" },
  { name: "الظهر", time: "১:৪৫ PM", icon: "☀️" },
  { name: "العصر", time: "৪:৩০ PM", icon: "🌤️" },
  { name: "المغرب", time: "৫:৪৫ PM", icon: "🌇" },
  { name: "العشاء", time: "৯:১৫ PM", icon: "🌙" }
];

// কার্ডগুলো ওয়েবসাইটে দেখানোর কোড
const grid = document.getElementById("prayerGrid");

grid.innerHTML = mosqueData.map(p => `
  <div class="prayer-card">
    <div class="prayer-info">
      <div class="icon-box">${p.icon}</div>
      <div class="prayer-name">${p.name}</div>
    </div>
    <div class="prayer-time">${p.time}</div>
  </div>
`).join("");

</script>

</body>
</html>
